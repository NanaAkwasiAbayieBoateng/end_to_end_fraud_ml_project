name: Model CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [model-drift-detected]

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: pytest -q tests

  model-validation:
    if: github.event_name != 'schedule'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Train candidate and enforce baseline ROC-AUC
        run: >-
          python mlops/model_gate.py
          --data data/fraud_dataset.csv
          --baseline models/baseline_auc.json
          --model-output models/fraud_model_pipeline.joblib
          --metrics-output models/model_metrics.json
          --reference-output models/reference_stats.json
      - name: Export optimized ONNX classifier
        run: python mlops/export_onnx.py --model models/fraud_model_pipeline.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: validated-model
          path: |
            models/fraud_model_pipeline.joblib
            models/reference_stats.json
            models/model_metrics.json
            models/fraud_classifier.onnx
          if-no-files-found: error

  deploy-local:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, model-validation]
    runs-on: [self-hosted, fraud-model-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-model
          path: models
      - name: Build and deploy gated model locally
        shell: bash
        env:
          MODEL_VERSION: ${{ github.sha }}
        run: |
          docker compose --project-name fraud-model build --pull
          docker compose --project-name fraud-model up --detach --wait --force-recreate --remove-orphans

  drift-check:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, fraud-model-server]
    steps:
      - uses: actions/checkout@v4
      - name: Check recent local prediction logs for drift
        shell: bash
        env:
          DRIFT_DISPATCH_TOKEN: ${{ secrets.DRIFT_DISPATCH_TOKEN }}
          DRIFT_ALERT_WEBHOOK_URL: ${{ secrets.DRIFT_ALERT_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: docker compose --project-name fraud-model run --rm --no-deps drift-check
